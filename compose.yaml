services:
  cli:
    image: "${ODW_JURY_IMAGE:-odwolania2json-jury:final-20261122}"
    pull_policy: never
    network_mode: none
    read_only: true
    user: "${ODW_UID:-0}:${ODW_GID:-0}"
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: "${ODW_INPUT_DIR:-./input}"
        target: /work/input
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${ODW_OUTPUT_PARENT:-.}/${ODW_OUTPUT_NAME:-output}"
        target: /work/output
        bind:
          create_host_path: false
      - type: bind
        # Match RUN.md for output/ and keep a separate sibling journal for each custom output.
        source: "${ODW_OUTPUT_PARENT:-.}/.${ODW_OUTPUT_NAME:-output}.odwolania2json"
        target: /work/.output.odwolania2json
        bind:
          create_host_path: false
      - type: bind
        source: "${ODW_DIAGNOSTICS_DIR:-./diagnostics}"
        target: /work/diagnostics
        bind:
          create_host_path: false
